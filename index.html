<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Training</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <h1 class="title">Выбери свой продукт</h1>

<ul class="products-list"></ul>

<template id="product-card-template">
  <li class="product-card">
    <img class="product-card__image" src="" alt="">
    <span class="product-card__category"></span>
    <h2 class="product-card__name"></h2>
    <p class="product-card__description"></p>
    <span class="product-card__subtitle">Состав:</span>
    <ul class="product-card__ingredients"></ul>
    <div class="price-block product-card__price-block">
      <b class="price-block__price-label">Цена</b>
      <span class="price-block__price-value"></span>
    </div>
  </li>
</template>

<button class="color-btn">Поменять цвет</button>

<footer>
  <div class="footer-container">

    <div class="footer-brend">
      <h2>Product Cards</h2>
      <p>У Нас Самые Лучшие Продукты Для Кожи!</p>
    </div>

    <div class="footer-subscribe">
      <h3>Подпишись на наши акции:</h3>
      <form id="subscribe-form">
        <input type="email" id="email-input" placeholder="Введи Email...">
        <button type="submit">Подписаться</button>
      </form>
    </div>

      <nav class="footer-links">
        <h3>Быстрые ссылки</h3>
        <ul>
          <li><a href="#">Главная</a></li>
          <li><a href="#">Магазин</a></li>
          <li><a href="#">Контакты</a></li>
        </ul>
      </nav>
    
  </div>

  <div class="footer-bottom">
  <p>www.product-cards.com©all right reserve</p>
  </div>
</footer>


<script src="index.js"></script>
<script src="homework07.js"></script>  
<script src="homework08.js"></script>
<script src="homework09.js" type="module"></script>
<script src="homework-10.js" type="module"></script>
<script src="homework-11.js" type="module"></script>
</body>
</html>
